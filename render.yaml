# Render Blueprint for Herofolio. See docs/deploy/RUNBOOK.md before using it:
# the database is shared with ethics-reports and is NOT managed here.
#
# Env vars marked `sync: false` are entered by hand in the Render dashboard
# (Render prompts for them when the Blueprint is first created). Never commit
# their values.
services:
  # The Express API. The static site below proxies /api/* to it, so the browser
  # sees one origin: no CORS, and the session cookie stays first-party.
  - type: web
    name: herofolio-api
    runtime: node
    region: oregon # same region as the "Dinos and Donuts" database
    plan: free
    branch: main
    buildCommand: npm ci
    # Free instances can't use preDeployCommand, so migrations run at start,
    # as ethics-reports does. On a paid plan, move `npm run migrate` to
    # preDeployCommand. The server also refuses to start if any are pending.
    startCommand: npm run migrate && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # The Postgres schema Herofolio's tables live in.
      - key: DB_SCHEMA
        value: herofolio
      # Internal URL for the `herofolio` role (NOT the database's default
      # highdynamics user), so it isn't tied to the database with fromDatabase.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SIGNUP_INVITE_CODE
        sync: false
      - key: BOOTSTRAP_USER_EMAIL
        sync: false
      - key: BOOTSTRAP_USER_PASSWORD_HASH
        sync: false

  # The frontend. Render serves existing files first, then applies these rules.
  - type: web
    name: herofolio
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "24"
    routes:
      # Must stay above the SPA fallback. Update the host if the API service
      # gets a different onrender.com URL.
      - type: rewrite
        source: /api/*
        destination: https://herofolio-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
