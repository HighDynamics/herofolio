# Render Blueprint for Herofolio. See docs/deploy/RUNBOOK.md before using it:
# the database is shared with ethics-reports and is NOT managed here.
#
# Env vars marked `sync: false` are entered by hand in the Render dashboard
# (Render prompts for them when the Blueprint is first created). Never commit
# their values.
services:
  # One web service: Express serves the API under /api and the built frontend
  # (build/) everywhere else, so the browser sees a single origin.
  - type: web
    name: herofolio
    runtime: node
    region: oregon # same region as the "Dinos and Donuts" database
    plan: free
    branch: main
    # NODE_ENV=production would skip devDependencies, and the Vite build needs
    # them.
    buildCommand: npm ci --include=dev && npm run build
    # Free instances can't use preDeployCommand, so migrations run at start,
    # as ethics-reports does. On a paid plan, move `npm run migrate` to
    # preDeployCommand. The server also refuses to start if any are pending.
    startCommand: npm run migrate && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      # The Postgres schema Herofolio's tables live in.
      - key: DB_SCHEMA
        value: herofolio
      # Internal URL for the `herofolio` role (NOT the database's default
      # highdynamics user), so it isn't tied to the database with fromDatabase.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: SIGNUP_INVITE_CODE
        sync: false
      - key: BOOTSTRAP_USER_EMAIL
        sync: false
      - key: BOOTSTRAP_USER_PASSWORD_HASH
        sync: false
